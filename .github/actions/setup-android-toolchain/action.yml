name: Setup Android toolchain
description: JDK 17, Android SDK, Godot + templates, template Gradle aligné sur la version de Godot.

runs:
  using: composite
  steps:
    - name: Charger les versions figées
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' ci/versions.env >> "$GITHUB_ENV"

    - name: OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;${{ env.ANDROID_PLATFORM }} cmake;${{ env.ANDROID_CMAKE }} ndk;${{ env.ANDROID_NDK }}"

    - name: Godot + export templates
      uses: ./.github/actions/setup-godot
      with:
        templates: "true"

    - name: Configurer Godot pour Android
      shell: bash
      run: ci/scripts/configure_godot_android.sh

    - name: Template Gradle Android
      shell: bash
      run: ci/scripts/install_android_template.sh
