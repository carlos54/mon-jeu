name: Release

# Déclenché UNIQUEMENT par un tag vX.Y.Z poussé par un humain (les agents n'ont
# pas le droit de tagger). Chaîne :
#   quality -> build (Android/iOS) -> bêta (piste interne / TestFlight)
#   -> [approbation humaine, environnement "production"] -> production
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # ───────────────────────── Android ─────────────────────────
  android-build:
    needs: quality
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-toolchain

      - name: Injecter version et identifiants
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
        run: ci/scripts/set_version.sh "${REF_NAME#v}" "$RUN_NUMBER"

      - name: Décoder le keystore de release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Export APK + AAB signés
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ci/scripts/export_android.sh release

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/android/game-release.aab
            build/android/game-release.apk
          retention-days: 30

  android-internal:
    needs: android-build
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: build/android

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Google Play, piste interne
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: bundle exec fastlane android deploy_internal

  android-production:
    needs: android-internal
    runs-on: ubuntu-24.04
    # Environnement protégé : reviewers requis = validation humaine obligatoire.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Google Play, promotion en production (déploiement progressif)
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: bundle exec fastlane android promote_production

  # ─────────────────────────── iOS ───────────────────────────
  ios-build:
    needs: quality
    runs-on: macos-15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Godot + export templates
        uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Charger les versions figées
        run: grep -E '^[A-Z0-9_]+=' ci/versions.env >> "$GITHUB_ENV"

      - name: Injecter version et identifiants
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: ci/scripts/set_version.sh "${REF_NAME#v}" "$RUN_NUMBER"

      - name: Export du projet Xcode (headless)
        run: ci/scripts/export_ios.sh

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compiler, signer (match) et envoyer sur TestFlight
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/*.ipa
          retention-days: 30
          if-no-files-found: warn

  ios-production:
    needs: ios-build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "VERSION_NAME=${REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: App Store, soumission à la revue (publication manuelle)
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: bundle exec fastlane ios release
