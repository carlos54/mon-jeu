; Presets d'export versionnés. AUCUN secret ici : keystores et mots de passe
; sont fournis par variables d'environnement (GODOT_ANDROID_KEYSTORE_*).
; Les identifiants (package, bundle id, team id) et les versions sont injectés
; par ci/scripts/set_version.sh. Régénérez/diffez ce fichier depuis l'éditeur
; (Projet > Exporter) après chaque changement de version de Godot.

[preset.0]

name="Android APK"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, ci/*, fastlane/*, openclaw/*, addons/gdUnit4/*, reports/*"
export_path="build/android/game.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.example.monjeu"
package/name="Mon Jeu"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
screen/immersive_mode=true
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
permissions/vibrate=true

